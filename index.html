<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medieval castle — flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ea;--card:#fffdf8;--ink:#2a2622;--mute:#7a7268;--line:#d9d2c5;--acc:#6b2d3a;--ok:#2f6b4a;--bad:#a63a2e}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#2a2622;--ink:#efe9de;--mute:#a39a8c;--line:#454037;--acc:#d88a98;--ok:#7fc29c;--bad:#e8887c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:20px 16px 48px}
main{max-width:640px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:.95rem}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.stat{color:var(--mute);font-size:.9rem;margin-bottom:10px;display:flex;justify-content:space-between}
.scene{perspective:1200px}
.card{position:relative;height:300px;cursor:pointer;transition:transform .45s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.back{transform:rotateY(180deg)}
.term{font-size:2rem;font-weight:700;color:var(--acc)}
.vi{font-size:1.4rem;margin-bottom:10px}
.def{color:var(--mute);margin-bottom:10px}
.ex{font-style:italic}
.hint{color:var(--mute);font-size:.85rem;margin-top:14px}
.row{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;text-align:center}
.q .term{margin-bottom:4px}
.end{text-align:center;padding:30px 10px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
<h1>Medieval castle</h1>
<p class="sub">42 từ vựng về lâu đài thời trung cổ</p>
<nav>
<button id="m-flash" class="on">thẻ ghi nhớ</button>
<button id="m-quiz">trắc nghiệm</button>
<button id="shuf">xáo trộn</button>
<button id="rev">đảo mặt thẻ</button>
<button id="only">chỉ từ chưa thuộc</button>
<button id="reset">xóa tiến độ</button>
</nav>
<div id="app"></div>
</main>
<script>
// [term, nghĩa tiếng Việt, định nghĩa, ví dụ]
const DATA=[
["layout","bố cục, sơ đồ","the way in which the parts of something are arranged","The layout of the castle was designed for maximum defense."],
["medieval","thời trung cổ","relating to the Middle Ages","Medieval castles were built between the 10th and 16th centuries."],
["castle","lâu đài, thành trì","a large strong building used in the past to protect people","The castle stood on a hill overlooking the valley."],
["fortified","được gia cố, kiên cố hóa","strengthened with defensive works to protect it against attack","The castle was heavily fortified with thick walls."],
["stronghold","pháo đài, nơi cố thủ","a place that has been fortified to protect it against attack","The stronghold kept invaders at bay."],
["invader","kẻ xâm lược","someone who enters a place by force","The invaders attacked through the main gate."],
["at bay","ở thế bị chặn lại, bị kiềm chế","prevented from escaping or attacking","The walls kept the enemies at bay."],
["Outer Gatehouse","cổng ngoài","the main outer entrance building of a castle","The guards waited at the Outer Gatehouse."],
["chapel","nhà nguyện","a small church or room used for worship","The chapel was beside the gatehouse."],
["castle grounds","khuôn viên lâu đài","the land surrounding the castle","Visitors first entered the castle grounds."],
["Outer Court","sân ngoài","the outer section of a castle complex","The stables were located in the Outer Court."],
["moat","hào nước","a deep, wide ditch around a castle, filled with water","The moat surrounded part of the castle."],
["barbican","tiền đồn (đường hầm hẹp dẫn vào cổng trong)","a fortified outpost or gateway protecting the main entrance","The soldiers guarded the barbican closely."],
["Gatehouse","nhà cổng, cổng chính có tường bảo vệ","a strong building at the gateway to a castle","The portcullis was lowered under the Gatehouse."],
["fortified walls","tường kiên cố","walls built for defense","The fortified walls made the castle almost impenetrable."],
["enemy forces","lực lượng kẻ thù","groups of attacking soldiers","The narrow passage stopped large enemy forces."],
["Great Hall","đại sảnh","the main hall used for dining and meetings","The Great Hall was the center of castle life."],
["Great Chambers","phòng lớn, phòng riêng của quý tộc","large private rooms used for sleeping or meetings","The Great Chambers were next to the Great Hall."],
["Bakehouse","nhà nướng bánh","a room or building for baking bread","The Bakehouse was beside one of the towers."],
["courtyard","sân trong","an open space surrounded by walls or buildings","The Great Hall had a courtyard view."],
["Keep (donjon)","tháp chính (trung tâm phòng thủ)","the main tower of a castle used for defense and residence","The Keep was the safest part of the castle."],
["fortification","công sự, hệ thống phòng thủ","defensive structures built to protect","The fortifications included walls and towers."],
["drawbridge","cầu kéo","a bridge that can be raised or lowered over a moat","The guards raised the drawbridge at night."],
["portcullis","cổng sắt (có gai, kéo lên xuống)","a heavy grilled door that could be dropped down to block a gate","The portcullis was the castle’s last defense."],
["retractable","có thể kéo vào / thu vào được","able to be drawn back or pulled in","The drawbridge was retractable for safety."],
["blueprint","bản thiết kế","a detailed plan or design","There was no single blueprint for medieval castles."],
["luxurious","xa hoa, sang trọng","very comfortable and expensive","Later castles had more luxurious living areas."],
["judicial system","hệ thống tư pháp","the system of courts and laws","The medieval judicial system favored physical punishment."],
["physical punishment","hình phạt thể xác","punishment involving bodily harm","Prison sentences were rare; physical punishment was common."],
["defense","sự phòng thủ","the action of protecting from attack","The barbican was an important line of defense."],
["seal off","phong tỏa, chặn lại","to close an area so that people cannot enter or leave","The portcullis sealed off the entrance."],
["favouring","thiên về, ưa chuộng","preferring one thing over another","The system favoured punishment over imprisonment."],
["intent on","quyết tâm làm gì đó","determined to do something","The enemy was intent on invading the castle."],
["advance on","sự cải tiến so với","an improvement or development beyond something earlier","This layout was an advance on earlier designs."]
];
const KEY="castle-known";
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}};
let mode="flash",deck=[...DATA.keys()],i=0,flip=false,reversed=false,onlyNew=false;
let quiz={n:0,score:0,done:false,picked:null,opts:[]};
const $=id=>document.getElementById(id),app=$("app");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function build(){
  deck=[...DATA.keys()].filter(k=>!onlyNew||!known.has(k));
  i=0;flip=false;quiz={n:0,score:0,done:false,picked:null,opts:[]};
}
function render(){
  $("m-flash").classList.toggle("on",mode==="flash");
  $("m-quiz").classList.toggle("on",mode==="quiz");
  $("only").classList.toggle("on",onlyNew);
  $("rev").classList.toggle("on",reversed);
  if(!deck.length){app.innerHTML='<div class="end"><p>bạn đã thuộc hết các từ.</p></div>';return}
  mode==="flash"?flash():quizView();
}
function flash(){
  const d=DATA[deck[i]];
  const front=reversed?`<div class="vi">${esc(d[1])}</div>`:`<div class="term">${esc(d[0])}</div>`;
  const back=reversed
    ?`<div class="term">${esc(d[0])}</div><div class="def">${esc(d[2])}</div>`
    :`<div class="vi">${esc(d[1])}</div><div class="def">${esc(d[2])}</div>`;
  app.innerHTML=`<div class="stat"><span>${i+1} / ${deck.length}</span><span>đã thuộc ${known.size} / ${DATA.length}</span></div>
  <div class="scene"><div class="card ${flip?"flip":""}" id="card" tabindex="0">
  <div class="face">${front}<div class="hint">bấm hoặc nhấn Space để lật</div></div>
  <div class="face back">${back}<div class="ex">${esc(d[3])}</div></div></div></div>
  <div class="row"><button id="prev">← trước</button><button id="no">chưa thuộc</button><button id="yes">đã thuộc</button><button id="next">sau →</button></div>`;
  $("card").onclick=()=>{flip=!flip;$("card").classList.toggle("flip",flip)};
  $("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
  $("yes").onclick=()=>{known.add(deck[i]);save();go(1)};
  $("no").onclick=()=>{known.delete(deck[i]);save();go(1)};
}
function go(n){i=(i+n+deck.length)%deck.length;flip=false;render()}
function quizView(){
  if(quiz.done){
    app.innerHTML=`<div class="end"><h2>${quiz.score} / ${deck.length}</h2><p>hoàn thành bài trắc nghiệm.</p><button id="again">làm lại</button></div>`;
    $("again").onclick=()=>{shuffle(deck);build2()};return;
  }
  const k=deck[quiz.n],d=DATA[k];
  if(!quiz.opts.length){
    const others=shuffle([...DATA.keys()].filter(x=>x!==k)).slice(0,3);
    quiz.opts=shuffle([k,...others]);
  }
  const label=x=>reversed?DATA[x][0]:DATA[x][1];
  app.innerHTML=`<div class="stat"><span>câu ${quiz.n+1} / ${deck.length}</span><span>điểm ${quiz.score}</span></div>
  <div class="q"><div class="term">${esc(reversed?d[1]:d[0])}</div><div class="hint">${reversed?"chọn từ tiếng Anh đúng":"chọn nghĩa đúng"}</div></div>
  ${quiz.opts.map(x=>{let c="";if(quiz.picked!==null){if(x===k)c="ok";else if(x===quiz.picked)c="bad"}
    return `<button class="opt ${c}" data-k="${x}" ${quiz.picked!==null?"disabled":""}>${esc(label(x))}</button>`}).join("")}
  ${quiz.picked!==null?'<div class="row"><button id="nq">tiếp tục</button></div>':""}`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const x=+b.dataset.k;quiz.picked=x;
    if(x===k){quiz.score++;known.add(k)}else known.delete(k);
    save();render();
  });
  const nq=$("nq");if(nq)nq.onclick=()=>{quiz.n++;quiz.picked=null;quiz.opts=[];if(quiz.n>=deck.length)quiz.done=true;render()};
}
function build2(){quiz={n:0,score:0,done:false,picked:null,opts:[]};render()}
$("m-flash").onclick=()=>{mode="flash";flip=false;render()};
$("m-quiz").onclick=()=>{mode="quiz";build2()};
$("shuf").onclick=()=>{shuffle(deck);i=0;flip=false;build2()};
$("rev").onclick=()=>{reversed=!reversed;flip=false;quiz.opts=[];render()};
$("only").onclick=()=>{onlyNew=!onlyNew;build();render()};
$("reset").onclick=()=>{known.clear();save();build();render()};
document.addEventListener("keydown",e=>{
  if(mode!=="flash"||!deck.length)return;
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "){e.preventDefault();flip=!flip;$("card").classList.toggle("flip",flip)}
});
build();render();
</script>
</body>
</html>
